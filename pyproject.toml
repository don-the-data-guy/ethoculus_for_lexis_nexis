[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ethoculus-for-lexis-nexis"
version = "0.1.0"
description = "Controlled behavioral experimentation framework for LexisNexis AI APIs"
requires-python = ">=3.10"

dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "tenacity>=8.2,<10"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ethoculus_lexis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
